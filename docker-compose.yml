services:
    # 1. Datenbank: MySQL
    db:
        image: mysql:8.0
        container_name: datenfeed_db
        restart: unless-stopped
        environment:
            MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
            MYSQL_DATABASE: ${MYSQL_DATABASE}
            MYSQL_USER: ${MYSQL_USER}
            MYSQL_PASSWORD: ${MYSQL_PASSWORD}
        ports:
            - "${MYSQL_PORT}:3306"
        volumes:
            - db_data:/var/lib/mysql
        networks:
            - network_datenfeed

    # 2. Anwendung: PHP-FPM
    app:
        build:
            context: .
            dockerfile: docker/php/Dockerfile
        container_name: datenfeed_app
        restart: unless-stopped
        extra_hosts:
            - "host.docker.internal:host-gateway"
        environment:
            DATABASE_URL: ${DATABASE_URL}
            APP_ENV: ${APP_ENV}
            APP_SECRET: ${APP_SECRET}
        volumes:
            - .:/var/www/html:delegated
        depends_on:
            - db
        networks:
            - network_datenfeed

    # 3. Webserver: Nginx
    web:
        image: nginx:alpine
        container_name: datenfeed_web
        restart: unless-stopped
        ports:
            - "${NGINX_PORT}:80"
        volumes:
            - .:/var/www/html:ro
            - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
        depends_on:
            - app
        networks:
            - network_datenfeed

    # 4. Composer-Helper
    composer:
        build:
            context: .
            dockerfile: docker/composer/Dockerfile
        volumes:
            - .:/var/www/html:delegated
        networks:
            - network_datenfeed

volumes:
    db_data:

networks:
    network_datenfeed:
        driver: bridge
