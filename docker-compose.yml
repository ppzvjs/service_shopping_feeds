version: '3.8'

services:
  webserver:
    container_name: webserver_shopping_service
    build:
      context: ./apache
      dockerfile: apache.dockerfile
    ports:
      - '${HTTP_PORT}:80'
      - '${HTTPS_PORT}:443'
    volumes:
      - ./src:/var/www/html
      - ./apache/ssl/localhost.crt:/etc/ssl/certs/localhost.crt
      - ./apache/ssl/localhost.key:/etc/ssl/private/localhost.key
    depends_on:
      - db

  db:
    container_name: database_shopping_feed
    image: mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
      MYSQL_DATABASE: ${DB_DATABASE}
      MYSQL_USER: ${DB_USERNAME}
      MYSQL_PASSWORD: ${DB_PASSWORD}
    ports:
      - '${DB_PORT}:3306'
    healthcheck:
      test: "exit 0"
    volumes:
      - db:/var/lib/mysql

  composer:
    container_name: composer
    build:
      context: ./dockerfiles
      dockerfile: composer.dockerfile
    volumes:
      - ./src:/var/www/html

  console:
    build:
      context: ./apache
      dockerfile: apache.dockerfile
    volumes:
      - ./src:/var/www/html
    entrypoint: [ 'php', '/var/www/html/bin/console' ]

volumes:
  db: